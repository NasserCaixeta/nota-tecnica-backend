name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nota_tecnica
          POSTGRES_PASSWORD: nota_tecnica
          POSTGRES_DB: nota_tecnica_ci_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U nota_tecnica -d nota_tecnica_ci_test" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      TEST_POSTGRES_URL: postgresql+asyncpg://nota_tecnica:nota_tecnica@localhost:5432/nota_tecnica_ci_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check app tests alembic
      - run: uv run ruff format --check app tests alembic
      - run: uv run pytest -q
